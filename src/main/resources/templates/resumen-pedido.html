<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .resumen-card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .icono-check { font-size: 60px; color: #27ae60; }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/tienda">SAN MARTÍN</a>
    </div>
</nav>

<div class="container" style="max-width: 700px;">

    <!-- Encabezado éxito -->
    <div class="text-center mb-4">
        <div class="icono-check">✅</div>
        <h2 class="mt-2 fw-bold">¡Pedido Confirmado!</h2>
        <p class="text-muted">Tu pedido fue registrado exitosamente.</p>
    </div>

    <!-- Datos del pedido -->
    <div class="card resumen-card mb-4">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">📋 Resumen del Pedido #<span th:text="${venta.idVenta}"></span></h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-6">
                    <strong>Fecha:</strong>
                    <p th:text="${venta.fechaVenta}"></p>
                </div>
                <div class="col-6">
                    <strong>Tipo de entrega:</strong>
                    <p th:text="${venta.tipoEntrega}"></p>
                </div>
            </div>
            <div th:if="${venta.direccionEntrega != null}" class="mb-3">
                <strong>Dirección de entrega:</strong>
                <p th:text="${venta.direccionEntrega}"></p>
            </div>
            <div class="row">
                <div class="col-4">
                    <strong>Estado:</strong>
                    <p><span class="badge bg-warning text-dark" th:text="${venta.estadoPago}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Productos comprados -->
    <div class="card resumen-card mb-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">🛒 Productos</h5>
        </div>
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Precio Unit.</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${resumen}">
                        <td th:text="${item.nombreProducto}"></td>
                        <td th:text="'S/. ' + ${item.precioUnitario}"></td>
                        <td th:text="${item.cantidad}"></td>
                        <td th:text="'S/. ' + ${item.subtotal}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <div>
                <small class="text-muted">Subtotal: <strong th:text="'S/. ' + ${venta.subtotal}"></strong></small><br>
                <small class="text-muted">IGV (18%): <strong th:text="'S/. ' + ${venta.igv}"></strong></small>
            </div>
            <h5 class="text-danger">Total: <strong th:text="'S/. ' + ${venta.totalPagar}"></strong></h5>
        </div>
    </div>

    <!-- Botones -->
    <div class="d-flex gap-3 justify-content-center mb-5">
        <a href="/tienda" class="btn btn-danger px-4">Seguir Comprando</a>
        <a href="/mis-pedidos" class="btn btn-outline-danger px-4">Ver Mis Pedidos</a>
    </div>

</div>
</body>
</html>
