<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Distribuidora San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn-custom { width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="text-danger mb-4">SAN MARTÍN</h2>
        <p class="text-muted mb-4">Selecciona cómo deseas continuar:</p>
        <a href="/tienda" class="btn btn-outline-danger btn-custom">Ver Catálogo (Invitado)</a>
        <hr>
        <a href="/login" class="btn btn-danger btn-custom">Iniciar Sesión</a>
        <a href="/registro" class="btn btn-outline-secondary btn-custom">Registrarse</a>
        <div class="mt-4">
            <a href="/admin" class="text-secondary small">Panel Administrativo</a>
        </div>
    </div>
</body>
</html>
