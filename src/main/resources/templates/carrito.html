<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/tienda">← Seguir comprando</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div class="container">
    <h3 class="mb-4">🛒 Mi Carrito</h3>

    <!-- Carrito vacío -->
    <div th:if="${#lists.isEmpty(carrito)}" class="text-center py-5">
        <p class="text-muted fs-5">Tu carrito está vacío.</p>
        <a href="/tienda" class="btn btn-danger px-4">Ver Productos</a>
    </div>

    <!-- Carrito con productos -->
    <div th:if="${!#lists.isEmpty(carrito)}">
        <div class="card shadow-sm mb-4">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th>Precio Unit.</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${carrito}">
                            <td th:text="${item.nombreProducto}"></td>
                            <td th:text="'S/. ' + ${item.precioUnitario}"></td>
                            <td th:text="${item.cantidad}"></td>
                            <td th:text="'S/. ' + ${item.subtotal}"></td>
                            <td>
                                <a th:href="@{/carrito/eliminar/{id}(id=${item.idProducto})}"
                                   class="btn btn-sm btn-outline-danger">✕</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Total -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/carrito/vaciar" class="btn btn-outline-secondary">Vaciar Carrito</a>
            <h5>Total: <span class="text-danger fw-bold" th:text="'S/. ' + ${total}"></span></h5>
        </div>

        <!-- Formulario de confirmación con tipo de entrega -->
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirmar Pedido</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/carrito/confirmar}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-bold">¿Cómo deseas recibir tu pedido?</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoEntrega"
                                   id="tienda" value="Tienda" checked
                                   onclick="document.getElementById('campoDir').style.display='none'">
                            <label class="form-check-label" for="tienda">
                                🏪 Recoger en tienda
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoEntrega"
                                   id="domicilio" value="Domicilio"
                                   onclick="document.getElementById('campoDir').style.display='block'">
                            <label class="form-check-label" for="domicilio">
                                🚚 Envío a domicilio
                            </label>
                        </div>
                    </div>

                    <!-- Campo dirección, oculto por defecto -->
                    <div id="campoDir" style="display:none;" class="mb-3">
                        <label class="form-label">Dirección de entrega</label>
                        <input type="text" name="direccionEntrega" class="form-control"
                               placeholder="Ej: Av. Los Jardines 123, Ica">
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-danger px-5">
                            Confirmar Pedido
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
