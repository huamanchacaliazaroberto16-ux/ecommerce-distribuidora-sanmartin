<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        header { background-color: #b30000; color: white; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<header>
    <h1><i class="bi bi-people-fill"></i> Clientes Registrados</h1>
    <a href="/admin" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al Panel</a>
</header>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#Cliente</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Tipo Doc.</th>
                        <th>N° Doc.</th>
                        <th>Dirección Fiscal</th>
                        <th>Pedidos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(listaClientes)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay clientes registrados.</td>
                    </tr>
                    <tr th:each="c : ${listaClientes}">
                        <td th:text="${c.idCliente}"></td>
                        <td th:text="${c.nombreCompleto}"></td>
                        <td th:text="${c.correo != null ? c.correo : '-'}"></td>
                        <td th:text="${c.tipoDocumento != null ? c.tipoDocumento : '-'}"></td>
                        <td th:text="${c.numeroDocumento != null ? c.numeroDocumento : '-'}"></td>
                        <td th:text="${c.direccionFiscal != null ? c.direccionFiscal : '-'}"></td>
                        <td>
                            <a th:href="@{/clientes/{id}/pedidos(id=${c.idCliente})}"
                               class="btn btn-sm btn-outline-danger"><i class="bi bi-eye"></i> Ver Pedidos</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
