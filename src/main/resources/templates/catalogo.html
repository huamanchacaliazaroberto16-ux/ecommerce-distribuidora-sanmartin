<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Distribuidora San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .product-card { transition: transform 0.2s; border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .product-card:hover { transform: scale(1.03); }
        .card-img-top { height: 180px; object-fit: contain; background: #fff; padding: 15px; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .btn-comprar { background-color: #d32f2f; color: white; border-radius: 20px; }
        .btn-comprar:hover { background-color: #b30000; color: white; }
        .filtro-categoria { border-radius: 20px; padding: 6px 14px; margin-right: 6px; margin-bottom: 8px; display: inline-block; font-size: 14px; }
        .filtro-categoria.activo { background-color: #d32f2f; color: white; }
        .filtro-categoria:not(.activo) { background-color: white; color: #333; border: 1px solid #ddd; }
        .filtro-categoria:hover { text-decoration: none; opacity: 0.85; }
        .navbar-brand { font-size: 1.2rem; }
        @media (max-width: 576px) {
            .card-img-top { height: 140px; }
            .filtro-categoria { padding: 5px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-3">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-bold text-danger" href="/tienda">SAN MARTÍN</a>
            <div class="d-flex gap-1 align-items-center flex-wrap justify-content-end">
                <div sec:authorize="isAuthenticated()">
                    <a href="/mis-pedidos" class="btn btn-outline-secondary btn-sm me-1">📋</a>
                    <a href="/carrito" class="btn btn-outline-danger btn-sm me-1">🛒 Carrito</a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">Salir</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="btn btn-danger btn-sm">Iniciar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3">

        <!-- Buscador -->
        <form th:action="@{/tienda}" method="get" class="mb-3">
            <div class="input-group">
                <input type="text" name="buscar" th:value="${buscarTexto}"
                       class="form-control"
                       placeholder="Buscar productos...">
                <button class="btn btn-danger" type="submit">🔍</button>
            </div>
        </form>

        <!-- Filtro categorías -->
        <div class="mb-3" style="overflow-x: auto; white-space: nowrap; padding-bottom: 4px;">
            <a th:href="@{/tienda}"
               th:classappend="${categoriaSeleccionada == null} ? ' activo' : ''"
               class="filtro-categoria">Todas</a>
            <a th:each="cat : ${listaCategorias}"
               th:href="@{/tienda(categoria=${cat.idCategoria})}"
               th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.idCategoria} ? ' activo' : ''"
               th:text="${cat.nombre}"
               class="filtro-categoria">
            </a>
        </div>

        <!-- Mensaje pedido confirmado -->
        <div th:if="${param.pedido}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
            ✅ ¡Tu pedido fue confirmado exitosamente!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h5 class="mb-3">Nuestros Productos</h5>

        <!-- Sin resultados -->
        <div th:if="${#lists.isEmpty(listaProductos)}" class="text-center py-5">
            <p class="text-muted">No se encontraron productos.</p>
        </div>

        <!-- Grid de productos -->
        <div class="row row-cols-2 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
            <div class="col" th:each="p : ${listaProductos}">
                <div class="card product-card h-100">
                    <a th:href="@{/producto/{id}(id=${p.idProducto})}">
                        <img th:src="${p.urlImagen}" class="card-img-top"
                             onerror="this.src='https://via.placeholder.com/200'">
                    </a>
                    <div class="card-body d-flex flex-column">
                        <a th:href="@{/producto/{id}(id=${p.idProducto})}"
                           class="text-decoration-none text-dark">
                            <h6 class="card-title" th:text="${p.nombreProducto}">Nombre</h6>
                        </a>
                        <p class="text-danger fw-bold mb-2" th:text="'S/. ' + ${p.precioUnitario}">Precio</p>
                        <div class="mt-auto">
                            <a th:href="@{/carrito/agregar/{id}(id=${p.idProducto})}"
                               sec:authorize="isAuthenticated()"
                               class="btn btn-comprar w-100 btn-sm">Agregar al Carrito</a>
                            <button class="btn btn-comprar w-100 btn-sm"
                                    sec:authorize="!isAuthenticated()"
                                    onclick="document.getElementById('modalLogin').style.display='flex'">
                                Agregar al Carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal aviso login -->
    <div id="modalLogin" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; text-align:center; max-width:340px; width:90%; margin: 0 15px;">
            <h5 class="mb-3">Inicia sesión para continuar</h5>
            <p class="text-muted mb-4">Para agregar productos al carrito debes iniciar sesión primero.</p>
            <a href="/login" class="btn btn-danger px-4 me-2">Iniciar Sesión</a>
            <button onclick="document.getElementById('modalLogin').style.display='none'" class="btn btn-outline-secondary px-3">Cancelar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
