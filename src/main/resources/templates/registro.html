<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #b30000 0%, #d32f2f 50%, #ff6659 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 45px 40px;
            width: 100%;
            max-width: 480px;
        }
        .brand { font-size: 26px; font-weight: 900; color: #d32f2f; margin-bottom: 5px; }
        .brand-sub { color: #888; font-size: 13px; margin-bottom: 25px; }
        .form-label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 11px 15px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #d32f2f; box-shadow: none; }
        .btn-register {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-register:hover { background: #b30000; color: white; }
        .link-login { color: #d32f2f; text-decoration: none; font-weight: 600; }
        .link-login:hover { color: #b30000; }
        .requisito { font-size: 12px; color: #aaa; margin-top: 4px; }
        .seccion-titulo { font-size: 11px; font-weight: 700; color: #d32f2f; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <div class="text-center">
                <img src="/images/logo_empresa.png" alt="San Martín" style="height: 55px; margin-bottom: 10px;">
                <div class="brand-sub">Crea tu cuenta y empieza a comprar</div>
            </div>

            <form id="formRegistro" th:action="@{/registro}" method="post">

                <div class="seccion-titulo">Datos Personales</div>

                <div class="row g-3">
                    <div class="col-12">
    <label class="form-label">Nombre Completo</label>
    <input type="text" name="nombreCompleto" class="form-control"
           placeholder="Ej: Juan Pérez" required>
</div>
<div class="col-12">
    <label class="form-label">Usuario <span class="text-danger">*</span></label>
    <input type="text" name="username" class="form-control"
           placeholder="Ej: juan123 (sin espacios)" required
           pattern="[a-zA-Z0-9_]+" title="Solo letras, números y guión bajo">
    <div class="requisito">Con este usuario iniciarás sesión</div>
</div>
                    <div class="col-md-6">
                        <label class="form-label">DNI <span class="text-danger">*</span></label>
                        <input type="text" name="dni" id="dni" class="form-control"
                               placeholder="12345678" maxlength="8" minlength="8"
                               pattern="[0-9]{8}" required>
                        <div class="requisito">8 dígitos numéricos</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Celular <span class="text-danger">*</span></label>
                        <input type="text" name="celular" id="celular" class="form-control"
                               placeholder="987654321" maxlength="9" minlength="9"
                               pattern="[0-9]{9}" required>
                        <div class="requisito">9 dígitos</div>
                    </div>
                </div>

                <div class="seccion-titulo mt-3">Acceso a la Cuenta</div>

                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                        <input type="password" name="password" id="password" class="form-control"
                               placeholder="Mín. 8 caracteres, mayúscula y número" required>
                        <div id="passError" class="text-danger small mt-1" style="display:none;"></div>
                        <div class="mt-2 d-flex gap-2 flex-wrap">
                            <small id="req-length" class="text-muted">❌ Mínimo 8 caracteres</small>
                            <small id="req-upper" class="text-muted">❌ Una mayúscula</small>
                            <small id="req-num" class="text-muted">❌ Un número</small>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register mt-4">✏️ Crear Cuenta</button>

                <div class="text-center mt-3">
                    <span class="text-muted small">¿Ya tienes cuenta? </span>
                    <a href="/login" class="link-login">Inicia sesión aquí</a>
                </div>
                <div class="text-center mt-2">
                    <a href="/tienda" class="text-muted" style="font-size: 12px;">👁️ Ver catálogo como invitado</a>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center text-white pb-3" style="font-size: 12px; opacity: 0.7;">
        © 2026 Distribuidora San Martín — UTP Ica
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const passInput = document.getElementById('password');
        const reqLength = document.getElementById('req-length');
        const reqUpper = document.getElementById('req-upper');
        const reqNum = document.getElementById('req-num');

        passInput.addEventListener('input', function() {
            const val = this.value;
            const hasLength = val.length >= 8;
            const hasUpper = /[A-Z]/.test(val);
            const hasNum = /[0-9]/.test(val);

            reqLength.textContent = (hasLength ? '✅' : '❌') + ' Mínimo 8 caracteres';
            reqLength.className = hasLength ? 'text-success small' : 'text-muted small';
            reqUpper.textContent = (hasUpper ? '✅' : '❌') + ' Una mayúscula';
            reqUpper.className = hasUpper ? 'text-success small' : 'text-muted small';
            reqNum.textContent = (hasNum ? '✅' : '❌') + ' Un número';
            reqNum.className = hasNum ? 'text-success small' : 'text-muted small';

            this.setCustomValidity(
                (!hasLength || !hasUpper || !hasNum) ? 'No cumple requisitos' : ''
            );
        });

        // Solo números en DNI y celular
        document.getElementById('dni').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
        document.getElementById('celular').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            const val = passInput.value;
            if (val.length < 8 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) {
                e.preventDefault();
                document.getElementById('passError').style.display = 'block';
                document.getElementById('passError').textContent = 'La contraseña no cumple los requisitos.';
            }
        });
    </script>
</body>
</html>
