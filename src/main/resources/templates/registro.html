<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro | Distribuidora San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; border-radius: 15px; }
        .btn-register { background-color: #28a745; color: white; }
        .btn-register:hover { background-color: #218838; color: white; }
    </style>
</head>
<body>

    <div class="card p-4 shadow">
        <h3 class="text-center text-danger mb-4">Crear Nueva Cuenta</h3>
        
        <form th:action="@{/registro}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Elige un usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Min. 6 caracteres" required>
            </div>
            
            <button type="submit" class="btn btn-register w-100 mb-3">Registrarse</button>
            
            <div class="text-center">
                <small>¿Ya tienes cuenta? <a href="/login" class="text-danger">Inicia sesión aquí</a></small>
            </div>
        </form>
    </div>

</body>
</html>
