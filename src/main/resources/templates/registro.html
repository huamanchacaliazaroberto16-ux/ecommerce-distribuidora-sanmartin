<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #b30000 0%, #d32f2f 50%, #ff6659 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .register-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 45px 40px;
            width: 100%;
            max-width: 440px;
        }
        .brand { font-size: 26px; font-weight: 900; color: #d32f2f; margin-bottom: 5px; }
        .brand-sub { color: #888; font-size: 13px; margin-bottom: 30px; }
        .form-label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #d32f2f; box-shadow: none; }
        .btn-register {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-register:hover { background: #b30000; color: white; }
        .link-login { color: #d32f2f; text-decoration: none; font-weight: 600; }
        .link-login:hover { color: #b30000; }
        .requisito { font-size: 12px; color: #aaa; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <div class="text-center">
                <div class="brand">🏪 SAN MARTÍN</div>
                <div class="brand-sub">Crea tu cuenta y empieza a comprar</div>
            </div>

            <form th:action="@{/registro}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control"
                           placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Elige un nombre de usuario" required>
                    <div class="requisito">Sin espacios ni caracteres especiales</div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <div class="requisito">Usa letras y números para mayor seguridad</div>
                </div>

                <button type="submit" class="btn-register">✏️ Crear Cuenta</button>

                <div class="text-center mt-4">
                    <span class="text-muted small">¿Ya tienes cuenta? </span>
                    <a href="/login" class="link-login">Inicia sesión aquí</a>
                </div>
                <div class="text-center mt-2">
                    <a href="/tienda" class="text-muted" style="font-size: 12px;">👁️ Ver catálogo como invitado</a>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center text-white pb-3" style="font-size: 12px; opacity: 0.7;">
        © 2026 Distribuidora San Martín — UTP Ica
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
