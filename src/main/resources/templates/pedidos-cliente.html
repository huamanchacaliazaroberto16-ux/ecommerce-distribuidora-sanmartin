<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedidos del Cliente | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        header { background-color: #b30000; color: white; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<header>
    <h1>📋 Pedidos de <span th:text="${cliente != null ? cliente.nombreCompleto : 'Cliente'}"></span></h1>
    <a href="/clientes" class="btn btn-outline-light btn-sm">← Volver a Clientes</a>
</header>

<div class="container mt-4">

    <!-- Sin pedidos -->
    <div th:if="${#lists.isEmpty(listaPedidos)}" class="text-center py-5">
        <p class="text-muted fs-5">Este cliente no tiene pedidos.</p>
    </div>

    <!-- Con pedidos -->
    <div th:if="${!#lists.isEmpty(listaPedidos)}" class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#Venta</th>
                        <th>Fecha</th>
                        <th>Subtotal</th>
                        <th>IGV</th>
                        <th>Total</th>
                        <th>Tipo Entrega</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${listaPedidos}">
                        <td th:text="${v.idVenta}"></td>
                        <td th:text="${v.fechaVenta}"></td>
                        <td th:text="'S/. ' + ${v.subtotal}"></td>
                        <td th:text="'S/. ' + ${v.igv}"></td>
                        <td th:text="'S/. ' + ${v.totalPagar}"></td>
                        <td th:text="${v.tipoEntrega}"></td>
                        <td th:text="${v.direccionEntrega != null ? v.direccionEntrega : '-'}"></td>
                        <td>
                            <span class="badge"
                                th:classappend="${v.estadoPago == 'Pendiente'} ? 'bg-warning text-dark' :
                                               (${v.estadoPago == 'Pagado'} ? 'bg-success' : 'bg-secondary')"
                                th:text="${v.estadoPago}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
