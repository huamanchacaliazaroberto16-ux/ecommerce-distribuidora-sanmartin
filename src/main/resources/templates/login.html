<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #b30000 0%, #d32f2f 50%, #ff6659 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
        }
        .brand { font-size: 26px; font-weight: 900; color: #d32f2f; margin-bottom: 5px; }
        .brand-sub { color: #888; font-size: 13px; margin-bottom: 30px; }
        .form-control {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #d32f2f; box-shadow: none; }
        .btn-login {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #b30000; color: white; }
        .divider { text-align: center; color: #aaa; margin: 20px 0; position: relative; }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #eee;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .btn-guest {
            background: #f8f9fa;
            color: #555;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 11px;
            font-size: 14px;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: all 0.2s;
        }
        .btn-guest:hover { background: #eee; color: #333; }
        .link-registro { color: #d32f2f; text-decoration: none; font-weight: 600; }
        .link-registro:hover { color: #b30000; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center">
                <div class="brand">🏪 SAN MARTÍN</div>
                <div class="brand-sub">Distribuidora Online — Ica</div>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
                ❌ Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 text-center" role="alert">
                ✅ Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-600 text-muted small">USUARIO</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-600 text-muted small">CONTRASEÑA</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login">🔐 Iniciar Sesión</button>
            </form>

            <div class="divider">o</div>

            <a href="/tienda" class="btn-guest">👁️ Ver Catálogo como Invitado</a>

            <div class="text-center mt-4">
                <span class="text-muted small">¿No tienes cuenta? </span>
                <a href="/registro" class="link-registro">Regístrate aquí</a>
            </div>

            <div class="text-center mt-2">
                <a href="/admin" class="text-muted" style="font-size: 12px;">Panel Administrativo</a>
            </div>
        </div>
    </div>

    <div class="text-center text-white pb-3" style="font-size: 12px; opacity: 0.7;">
        © 2026 Distribuidora San Martín — UTP Ica
    </div>
</body>
</html>
