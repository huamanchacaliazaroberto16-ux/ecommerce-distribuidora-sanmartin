<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 380px; border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="card p-4 shadow">
        <h3 class="text-center text-danger mb-4">Iniciar Sesión</h3>

        <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
            Usuario o contraseña incorrectos. Inténtalo de nuevo.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Ingresar</button>
        </form>
        <div class="text-center mt-3">
            <a href="/registro" class="text-muted small">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</body>
</html>
