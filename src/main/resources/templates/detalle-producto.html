<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.nombreProducto} + ' | San Martín'">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .producto-img { max-height: 350px; object-fit: contain; width: 100%; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .btn-agregar { background-color: #d32f2f; color: white; border-radius: 20px; padding: 10px 30px; font-size: 16px; }
        .btn-agregar:hover { background-color: #b30000; color: white; }
        .badge-stock-ok { background-color: #27ae60; }
        .badge-stock-bajo { background-color: #f39c12; }
        .badge-sin-stock { background-color: #c0392b; }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/tienda">← Volver a la Tienda</a>
        <div class="d-flex gap-2 align-items-center">
            <div sec:authorize="isAuthenticated()">
                <a href="/mis-pedidos" class="btn btn-outline-secondary px-3 me-2">📋 Mis Pedidos</a>
                <a href="/carrito" class="btn btn-outline-danger px-3 me-2">🛒 Mi Carrito</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger px-3">Cerrar Sesión</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn btn-danger px-4">Iniciar Sesión</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-2">
    <div class="row g-5">

        <!-- Imagen -->
        <div class="col-md-5">
            <img th:src="${producto.urlImagen}" class="producto-img"
                 onerror="this.src='https://via.placeholder.com/400'">
        </div>

        <!-- Info -->
        <div class="col-md-7">
            <h2 class="fw-bold" th:text="${producto.nombreProducto}"></h2>

            <h3 class="text-danger fw-bold mt-3" th:text="'S/. ' + ${producto.precioUnitario}"></h3>

            <!-- Estado de stock -->
            <div class="mt-2 mb-3">
                <span th:if="${producto.stockActual > producto.stockMinimo}"
                      class="badge badge-stock-ok fs-6">✔ En stock</span>
                <span th:if="${producto.stockActual <= producto.stockMinimo and producto.stockActual > 0}"
                      class="badge badge-stock-bajo fs-6">⚠ Stock bajo</span>
                <span th:if="${producto.stockActual == 0}"
                      class="badge badge-sin-stock fs-6">✘ Sin stock</span>
                <small class="text-muted ms-2" th:text="'(' + ${producto.stockActual} + ' disponibles)'"></small>
            </div>

            <!-- Descripción -->
            <div class="mb-4">
                <h5>Descripción</h5>
                <p class="text-muted"
                   th:text="${producto.descripcion != null ? producto.descripcion : 'Sin descripción disponible.'}">
                </p>
            </div>

            <!-- Botón agregar al carrito -->
            <div sec:authorize="isAuthenticated()">
                <a th:href="@{/carrito/agregar/{id}(id=${producto.idProducto})}"
                   th:classappend="${producto.stockActual == 0} ? ' disabled'"
                   class="btn btn-agregar">
                    🛒 Agregar al Carrito
                </a>
            </div>

            <!-- Invitado -->
            <div sec:authorize="!isAuthenticated()">
                <button class="btn btn-agregar"
                        onclick="document.getElementById('modalLogin').style.display='flex'">
                    🛒 Agregar al Carrito
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal aviso login -->
<div id="modalLogin" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:40px; border-radius:15px; text-align:center; max-width:380px; width:90%;">
        <h5 class="mb-3">Inicia sesión para continuar</h5>
        <p class="text-muted mb-4">Para agregar productos al carrito debes iniciar sesión primero.</p>
        <a href="/login" class="btn btn-danger px-4 me-2">Iniciar Sesión</a>
        <button onclick="document.getElementById('modalLogin').style.display='none'" class="btn btn-outline-secondary px-4">Cancelar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
