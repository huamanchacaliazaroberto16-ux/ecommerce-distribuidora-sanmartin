<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="mb-4">Registrar / Editar Producto</h2>
                
                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                    
                    <input type="hidden" th:field="*{idProducto}">

                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombreProducto}" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio Unitario</label>
                            <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Actual</label>
                            <input type="number" th:field="*{stockActual}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" th:field="*{stockMinimo}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">URL de Imagen</label>
                            <input type="text" th:field="*{urlImagen}" class="form-control" placeholder="Ej: https://ejemplo.com/foto.jpg">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    <a href="/admin" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
