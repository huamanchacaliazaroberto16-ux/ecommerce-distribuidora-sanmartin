<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="mb-4">Registrar / Editar Producto</h2>

                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

                    <input type="hidden" th:field="*{idProducto}">

                    <div class="mb-3">
                      <label class="form-label">Nombre del Producto</label>
                      <input type="text" th:field="*{nombreProducto}" class="form-control" required>
                      <span th:if="${#fields.hasErrors('nombreProducto')}" th:errors="*{nombreProducto}" class="text-danger small"></span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{idCategoria}" id="selectCategoria" class="form-select" required>
                            <option value="">-- Selecciona una categoría --</option>
                            <option th:each="cat : ${listaCategorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nombre}">
                            </option>
                            <option value="nueva">+ Crear nueva categoría...</option>
                        </select>

                        <!-- Campo oculto para nueva categoría -->
                        <div id="campoNuevaCategoria" style="display:none;" class="mt-2 d-flex gap-2">
                            <input type="text" id="inputNuevaCategoria" class="form-control" placeholder="Nombre de la nueva categoría">
                            <button type="button" id="btnAgregarCategoria" class="btn btn-success">Agregar</button>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                        <label class="form-label">Precio Unitario</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{precioUnitario}" class="form-control" required>
                        <span th:if="${#fields.hasErrors('precioUnitario')}" th:errors="*{precioUnitario}" class="text-danger small"></span>
                   </div>
                        <div class="col-md-6 mb-3">
                        <label class="form-label">Stock Actual</label>
                        <input type="number" min="0" th:field="*{stockActual}" class="form-control" required>
                        <span th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}" class="text-danger small"></span>
                    </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                        <label class="form-label">Stock Mínimo</label>
                        <input type="number" min="0" th:field="*{stockMinimo}" class="form-control" required>
                        <span th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}" class="text-danger small"></span>
                    </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">URL de Imagen</label>
                            <input type="text" th:field="*{urlImagen}" class="form-control" placeholder="Ej: https://ejemplo.com/foto.jpg">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                    </div>

                    <button type="submit" id="btnGuardarProducto" class="btn btn-primary">Guardar Producto</button>
                    <a href="/admin" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        const selectCategoria = document.getElementById('selectCategoria');
        const btnSubmit = document.getElementById('btnGuardarProducto');

        selectCategoria.addEventListener('change', function() {
            const campo = document.getElementById('campoNuevaCategoria');
            if (this.value === 'nueva') {
                campo.style.display = 'flex';
                btnSubmit.disabled = true;
            } else {
                campo.style.display = 'none';
                btnSubmit.disabled = false;
            }
        });

        document.getElementById('btnAgregarCategoria').addEventListener('click', function() {
            const nombre = document.getElementById('inputNuevaCategoria').value.trim();
            if (!nombre) {
                alert('Escribe un nombre para la categoría');
                return;
            }

            fetch('/categorias/crear-rapido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'nombre=' + encodeURIComponent(nombre)
            })
            .then(res => res.json())
            .then(cat => {
                const nuevaOption = document.createElement('option');
                nuevaOption.value = cat.idCategoria;
                nuevaOption.text = cat.nombre;
                selectCategoria.insertBefore(nuevaOption, selectCategoria.lastElementChild);
                selectCategoria.value = cat.idCategoria;
                document.getElementById('campoNuevaCategoria').style.display = 'none';
                document.getElementById('inputNuevaCategoria').value = '';
                btnSubmit.disabled = false;
            })
            .catch(() => alert('Error al crear la categoría'));
        });
    </script>
</body>
</html>
