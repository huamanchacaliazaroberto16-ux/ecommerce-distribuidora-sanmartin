<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Envíos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        header { background-color: #b30000; color: white; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; margin: 0; }
        .badge-preparacion { background-color: #f39c12; }
        .badge-camino      { background-color: #2980b9; }
        .badge-entregado   { background-color: #27ae60; }
        .badge-cancelado   { background-color: #c0392b; }
    </style>
</head>
<body>

<header>
    <h1>🚚 Gestión de Despachos y Envíos</h1>
    <a href="/admin" class="btn btn-outline-light btn-sm">← Volver al Panel</a>
</header>

<div class="container mt-4">

    <!-- Botón para registrar nuevo envío -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Lista de Envíos</h5>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalNuevoEnvio">
            + Registrar Envío
        </button>
    </div>

    <!-- Tabla de envíos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#Envío</th>
                        <th>ID Venta</th>
                        <th>ID Repartidor</th>
                        <th>Dirección</th>
                        <th>Fecha Despacho</th>
                        <th>Estado</th>
                        <th>Observaciones</th>
                        <th>Cambiar Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(listaEnvios)}">
                        <td colspan="8" class="text-center text-muted py-4">No hay envíos registrados aún.</td>
                    </tr>
                    <tr th:each="e : ${listaEnvios}">
                        <td th:text="${e.idEnvio}"></td>
                        <td th:text="${e.idVenta}"></td>
                        <td th:text="${e.idRepartidor}"></td>
                        <td th:text="${e.direccionEntrega}"></td>
                        <td th:text="${e.fechaDespacho != null ? e.fechaDespacho : '-'}"></td>
                        <td>
                            <span class="badge"
                                th:classappend="${e.estadoEntrega == 'En preparación'} ? 'badge-preparacion' :
                                               (${e.estadoEntrega == 'En camino'} ? 'badge-camino' :
                                               (${e.estadoEntrega == 'Entregado'} ? 'badge-entregado' : 'badge-cancelado'))"
                                th:text="${e.estadoEntrega}">
                            </span>
                        </td>
                        <td th:text="${e.observaciones != null ? e.observaciones : '-'}"></td>
                        <td>
                            <form th:action="@{/envios/estado}" method="post" class="d-flex gap-1">
                                <input type="hidden" name="id" th:value="${e.idEnvio}">
                                <select name="estado" class="form-select form-select-sm">
                                    <option value="En preparación">En preparación</option>
                                    <option value="En camino">En camino</option>
                                    <option value="Entregado">Entregado</option>
                                    <option value="Cancelado">Cancelado</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-danger">OK</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Registrar nuevo envío -->
<div class="modal fade" id="modalNuevoEnvio" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Registrar Nuevo Envío</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/envios/guardar}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
    <label class="form-label">ID Venta <span class="text-muted">(opcional)</span></label>
    <input type="number" name="idVenta" class="form-control" placeholder="Dejar vacío si aún no hay venta">
</div>
                    <div class="mb-3">
    <label class="form-label">Repartidor</label>
    <select name="idRepartidor" class="form-select" required>
        <option value="">-- Selecciona un repartidor --</option>
        <option th:each="r : ${listaRepartidores}"
                th:value="${r.idRepartidor}"
                th:text="${r.nombreCompleto} + ' - ' + ${r.vehiculo}">
        </option>
    </select>
</div>
                    <div class="mb-3">
                        <label class="form-label">Dirección de Entrega</label>
                        <input type="text" name="direccionEntrega" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-danger">Registrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
