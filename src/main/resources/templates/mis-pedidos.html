<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Pedidos | San Martín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="/tienda">← Volver a la Tienda</a>
        <div class="d-flex gap-2">
            <a href="/carrito" class="btn btn-outline-danger btn-sm">🛒 Mi Carrito</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h3 class="mb-4">📋 Mis Pedidos</h3>

    <div th:if="${#lists.isEmpty(listaPedidos)}" class="text-center py-5">
        <p class="text-muted fs-5">Aún no tienes pedidos realizados.</p>
        <a href="/tienda" class="btn btn-danger px-4">Ir a la Tienda</a>
    </div>

    <div th:if="${!#lists.isEmpty(listaPedidos)}" class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#Pedido</th>
                        <th>Fecha</th>
                        <th>Subtotal</th>
                        <th>IGV</th>
                        <th>Total</th>
                        <th>Tipo Entrega</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${listaPedidos}">
                        <td th:text="${p.idVenta}"></td>
                        <td th:text="${p.fechaVenta}"></td>
                        <td th:text="'S/. ' + ${p.subtotal}"></td>
                        <td th:text="'S/. ' + ${p.igv}"></td>
                        <td th:text="'S/. ' + ${p.totalPagar}"></td>
                        <td>
                            <span th:text="${p.tipoEntrega}"
                                  th:classappend="${p.tipoEntrega == 'Domicilio'} ? 'badge bg-primary' : 'badge bg-secondary'">
                            </span>
                        </td>
                        <td th:text="${p.direccionEntrega != null ? p.direccionEntrega : '-'}"></td>
                        <td>
                            <span class="badge"
                                th:classappend="${p.estadoPago == 'Pendiente'} ? 'bg-warning text-dark' :
                                               (${p.estadoPago == 'Pagado'} ? 'bg-success' : 'bg-secondary')"
                                th:text="${p.estadoPago}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
